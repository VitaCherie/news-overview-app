<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="News" />
<meta name="theme-color" content="#0f1620" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>News Overview</title>
<style>
  :root {
    --bg: #0f1620;
    --panel: #182230;
    --panel-2: #1e2a3a;
    --line: #29384a;
    --text: #e7edf5;
    --muted: #8a9bb0;
    --accent: #4bb3c7;
    --geopolitics: #d99a4e;
    --rights: #dc7b90;
    --tech: #4bb3c7;
    --science: #5cc08b;
    --business: #d7b455;
    --people: #b98cd6;
    --commentary: #8aa0c8;
    --shadow: 0 1px 2px rgba(0,0,0,0.25), 0 6px 22px rgba(0,0,0,0.28);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: max(env(safe-area-inset-top), 18px) 16px calc(env(safe-area-inset-bottom) + 44px);
    -webkit-font-smoothing: antialiased; line-height: 1.45;
  }
  .wrap { max-width: 820px; margin: 0 auto; }

  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  .date { color: var(--muted); font-size: 12px; letter-spacing: 0.6px; text-transform: uppercase; }
  h1 { font-size: 23px; margin: 3px 0 0; font-weight: 680; letter-spacing: -0.3px; }
  .intro { color: var(--text); font-size: 14.5px; line-height: 1.55; opacity: 0.9; margin: 10px 0 22px; }

  .listen { flex: none; display: inline-flex; align-items: center; gap: 7px; background: var(--accent); color: #06222a;
    border: none; border-radius: 999px; padding: 9px 15px; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: var(--shadow); }
  .listen:active { transform: scale(0.97); }
  .listen svg { width: 15px; height: 15px; }
  .listen.playing { background: transparent; color: var(--accent); border: 1px solid var(--accent); }

  .sec-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin: 26px 0 11px; font-weight: 700; }
  .sec-title:first-of-type { margin-top: 6px; }

  /* Topic chips */
  .chip { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase;
    padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .chip.geopolitics { color: var(--geopolitics); background: rgba(217,154,78,0.13); }
  .chip.rights { color: var(--rights); background: rgba(220,123,144,0.14); }
  .chip.tech { color: var(--tech); background: rgba(75,179,199,0.14); }
  .chip.science { color: var(--science); background: rgba(92,192,139,0.14); }
  .chip.business { color: var(--business); background: rgba(215,180,85,0.14); }
  .chip.people { color: var(--people); background: rgba(185,140,214,0.15); }
  .chip.commentary { color: var(--commentary); background: rgba(138,160,200,0.15); }

  /* Scan list */
  .scan { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 6px 14px; box-shadow: var(--shadow); }
  .scan-row { display: flex; gap: 11px; align-items: flex-start; padding: 11px 0; border-top: 1px solid var(--line); }
  .scan-row:first-child { border-top: none; }
  .scan-row .chip { margin-top: 1px; }
  .scan-text { font-size: 13.5px; line-height: 1.5; }
  .scan-text a { color: var(--accent); text-decoration: none; }
  .src { display: inline-block; margin-left: 6px; font-size: 11.5px; font-weight: 600; color: var(--accent); text-decoration: none; white-space: nowrap; opacity: 0.85; }
  .src:before { content: "· "; color: var(--muted); font-weight: 400; }

  /* Deep dive cards */
  .dive { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 13px; }
  .dive-head { display: flex; gap: 9px; align-items: center; margin-bottom: 9px; flex-wrap: wrap; }
  .dive h2 { font-size: 17px; font-weight: 670; margin: 0; letter-spacing: -0.2px; line-height: 1.3; width: 100%; }
  .block { margin-top: 11px; }
  .block .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
  .block p { margin: 0; font-size: 14px; line-height: 1.55; }
  .block.depth { background: var(--panel-2); border-radius: 11px; padding: 11px 12px; }
  .block.depth .lbl { color: var(--accent); }

  /* Perspectives */
  .persp { margin-top: 13px; border-top: 1px dashed var(--line); padding-top: 12px; }
  .persp .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); font-weight: 700; margin-bottom: 9px; }
  .lens-row { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; }
  .lens-name { flex: none; width: 62px; font-size: 12px; font-weight: 700; color: var(--text); padding-top: 1px; }
  .lens-take { font-size: 13.5px; line-height: 1.5; color: var(--muted); }

  /* Sources */
  .sources { margin-top: 13px; display: flex; flex-wrap: wrap; gap: 7px; }
  .sources a { font-size: 12px; color: var(--muted); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
  .sources a:active { border-color: var(--accent); color: var(--accent); }

  /* Radar */
  .radar { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.7; color: var(--muted); }

  footer { text-align: center; color: var(--muted); font-size: 11px; margin-top: 26px; }
  footer a { color: var(--muted); text-decoration: underline; cursor: pointer; }

  /* Password gate */
  .gate { max-width: 340px; margin: 14vh auto 0; text-align: center; }
  .gate .lock { font-size: 34px; }
  .gate h2 { font-size: 18px; margin: 12px 0 4px; }
  .gate p { color: var(--muted); font-size: 13px; margin: 0 0 18px; line-height: 1.5; }
  .gate input[type="password"] { width: 100%; padding: 13px 14px; font-size: 15px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
  .gate input[type="password"]:focus { outline: none; border-color: var(--accent); }
  .gate input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--accent); }
  .gate button { width: 100%; margin-top: 10px; padding: 13px; font-size: 15px; font-weight: 700; color: #06222a; background: var(--accent); border: none; border-radius: 12px; cursor: pointer; }
  .gate button:active { transform: scale(0.98); }
  .gate .err { color: #dc7b90; font-size: 13px; margin-top: 12px; min-height: 16px; }
  .gate label { display: flex; gap: 7px; align-items: center; justify-content: center; margin-top: 14px; font-size: 12px; color: var(--muted); cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div id="app"><p style="color:var(--muted)">Loading overview...</p></div>
  <footer id="foot"></footer>
</div>

<script>
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const esc = s => (s || "").replace(/[&<>"]/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[m]));
const playSvg = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const stopSvg = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';

const TOPICS = { geopolitics: "Geopolitics", rights: "Rights & equality", tech: "Tech & AI", science: "Science & biotech", business: "Business & startups", people: "People", commentary: "Deep read" };
const topicKey = t => (TOPICS[t] ? t : "commentary");
const chip = t => { const k = topicKey(t); return '<span class="chip ' + k + '">' + esc(TOPICS[k]) + '</span>'; };

/* ---------- Audio narration ---------- */
function buildNarration(d) {
  const p = [];
  if (d.dayLabel) p.push(d.dayLabel + ".");
  if (d.intro) p.push(d.intro);
  if (d.scan && d.scan.length) {
    p.push("The scan.");
    d.scan.forEach(s => p.push(s.text + "."));
  }
  if (d.deepDives && d.deepDives.length) {
    p.push("In depth.");
    d.deepDives.forEach(dv => {
      p.push(dv.title + ".");
      if (dv.what) p.push("What happened. " + dv.what);
      if (dv.depth) p.push("The deeper read. " + dv.depth);
      if (dv.perspectives && dv.perspectives.length) {
        p.push("Different lenses. " + dv.perspectives.map(x => x.lens + " frames it as: " + x.take).join(" "));
      }
    });
  }
  if (d.watch && d.watch.length) p.push("On the radar. " + d.watch.join(" "));
  return p.join(" ");
}

function setupAudio(btn, d) {
  let playing = false;
  const synth = window.speechSynthesis;
  if (!synth) { btn.style.display = "none"; return; }
  const stop = () => { synth.cancel(); playing = false; btn.classList.remove("playing"); btn.innerHTML = playSvg + "<span>Listen</span>"; };
  btn.addEventListener("click", () => {
    if (playing) { stop(); return; }
    const u = new SpeechSynthesisUtterance(buildNarration(d));
    u.rate = 1.0; u.pitch = 1.0;
    const voices = synth.getVoices();
    const pref = voices.find(v => /en-GB/i.test(v.lang)) || voices.find(v => /en/i.test(v.lang));
    if (pref) u.voice = pref;
    u.onend = stop; u.onerror = stop;
    synth.cancel();
    synth.speak(u);
    playing = true; btn.classList.add("playing"); btn.innerHTML = stopSvg + "<span>Stop</span>";
  });
  window.addEventListener("beforeunload", stop);
}

/* ---------- Render ---------- */
function render(d) {
  const app = document.getElementById("app");
  app.innerHTML = "";

  const head = el("header");
  const left = el("div");
  left.appendChild(el("div", "date", esc([d.dayLabel, d.editionLabel].filter(Boolean).join("  ·  "))));
  left.appendChild(el("h1", null, "Noon news overview"));
  head.appendChild(left);
  const btn = el("button", "listen", playSvg + "<span>Listen</span>");
  head.appendChild(btn);
  app.appendChild(head);
  if (d.intro) app.appendChild(el("div", "intro", esc(d.intro)));
  setupAudio(btn, d);

  // The scan
  if (d.scan && d.scan.length) {
    app.appendChild(el("div", "sec-title", "The 60-second scan"));
    const s = el("div", "scan");
    d.scan.forEach(item => {
      const row = el("div", "scan-row");
      row.innerHTML = chip(item.topic);
      const txt = el("div", "scan-text");
      let html = esc(item.text);
      const label = item.source ? esc(item.source) : (item.url ? "Source" : "");
      if (label) {
        html += item.url
          ? ' <a class="src" href="' + esc(item.url) + '" target="_blank" rel="noopener">' + label + ' ›</a>'
          : ' <span class="src">' + label + '</span>';
      }
      txt.innerHTML = html;
      row.appendChild(txt);
      s.appendChild(row);
    });
    app.appendChild(s);
  }

  // Deep dives
  if (d.deepDives && d.deepDives.length) {
    app.appendChild(el("div", "sec-title", "In depth"));
    d.deepDives.forEach(dv => {
      const c = el("div", "dive");
      const h = el("div", "dive-head");
      h.innerHTML = chip(dv.topic);
      c.appendChild(h);
      c.appendChild(el("h2", null, esc(dv.title)));

      if (dv.what) {
        const b = el("div", "block");
        b.appendChild(el("div", "lbl", "What happened"));
        b.appendChild(el("p", null, esc(dv.what)));
        c.appendChild(b);
      }
      if (dv.depth) {
        const b = el("div", "block depth");
        b.appendChild(el("div", "lbl", "The deeper read"));
        b.appendChild(el("p", null, esc(dv.depth)));
        c.appendChild(b);
      }
      if (dv.perspectives && dv.perspectives.length) {
        const pv = el("div", "persp");
        pv.appendChild(el("div", "lbl", "Different lenses"));
        dv.perspectives.forEach(x => {
          const r = el("div", "lens-row");
          r.appendChild(el("div", "lens-name", esc(x.lens)));
          r.appendChild(el("div", "lens-take", esc(x.take)));
          pv.appendChild(r);
        });
        c.appendChild(pv);
      }
      if (dv.sources && dv.sources.length) {
        const sr = el("div", "sources");
        dv.sources.forEach(s => {
          if (!s.url) return;
          const a = el("a", null, esc(s.label || "Source"));
          a.href = s.url; a.target = "_blank"; a.rel = "noopener";
          sr.appendChild(a);
        });
        c.appendChild(sr);
      }
      app.appendChild(c);
    });
  }

  // On the radar
  if (d.watch && d.watch.length) {
    app.appendChild(el("div", "sec-title", "On the radar"));
    const ul = el("ul", "radar");
    d.watch.forEach(x => ul.appendChild(el("li", null, esc(x))));
    app.appendChild(ul);
  }

  const when = d.generatedAt ? new Date(d.generatedAt).toLocaleString() : "";
  document.getElementById("foot").textContent = when ? "Generated " + when : "";
}

/* ---------- Decryption (in-browser, password never leaves the device) ---------- */
const PW_KEY = "news_pw";
async function decryptData(enc, password) {
  const dec = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const baseKey = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: dec(enc.salt), iterations: enc.iter, hash: "SHA-256" },
    baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
  );
  const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: dec(enc.iv) }, key, dec(enc.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}

function showError(msg) {
  document.getElementById("app").innerHTML = '<p style="color:#dc7b90">' + esc(msg) + '</p>';
}

function attachLock() {
  const foot = document.getElementById("foot");
  foot.innerHTML = (foot.textContent ? foot.textContent + " · " : "") + '<a id="lockLink">Lock</a>';
  document.getElementById("lockLink").addEventListener("click", () => { localStorage.removeItem(PW_KEY); location.reload(); });
}

function showGate(enc) {
  const app = document.getElementById("app");
  app.innerHTML = "";
  const g = el("div", "gate");
  g.appendChild(el("div", "lock", "🔒"));
  g.appendChild(el("h2", null, "News overview"));
  g.appendChild(el("p", null, "Enter your password to unlock today's overview. It decrypts on this device only."));
  const input = el("input");
  input.type = "password"; input.placeholder = "Password"; input.autocomplete = "current-password";
  const btn = el("button", null, "Unlock");
  const err = el("div", "err");
  const remember = el("input"); remember.type = "checkbox"; remember.checked = true;
  const rememberLabel = el("label"); rememberLabel.appendChild(remember); rememberLabel.appendChild(document.createTextNode("Remember on this device"));
  g.appendChild(input); g.appendChild(btn); g.appendChild(err); g.appendChild(rememberLabel);
  app.appendChild(g);
  input.focus();

  const attempt = async () => {
    err.textContent = ""; btn.textContent = "Unlocking...";
    try {
      const d = await decryptData(enc, input.value);
      if (remember.checked) localStorage.setItem(PW_KEY, input.value);
      render(d); attachLock();
    } catch (e) {
      btn.textContent = "Unlock";
      err.textContent = "Wrong password, try again.";
      input.select();
    }
  };
  btn.addEventListener("click", attempt);
  input.addEventListener("keydown", e => { if (e.key === "Enter") attempt(); });
}

async function boot() {
  let enc;
  try {
    enc = await fetch("data/news.enc.json?v=" + Date.now()).then(r => { if (!r.ok) throw new Error(); return r.json(); });
  } catch (e) {
    showError("Could not load today's overview. It may not have been generated yet.");
    return;
  }
  const saved = localStorage.getItem(PW_KEY);
  if (saved) {
    try { render(await decryptData(enc, saved)); attachLock(); return; }
    catch (e) { localStorage.removeItem(PW_KEY); }
  }
  showGate(enc);
}
boot();

if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = () => {};
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
